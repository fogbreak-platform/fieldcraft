[package]
name = "fogbreak-field"
description = "Fogbreak Field finite-element modeling in the browser"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "fogbreak-field"
path = "src/main.rs"

[target.'cfg(target_arch = "wasm32")'.dependencies]
fieldcraft-engine = { workspace = true }
fieldcraft-geometry = { workspace = true }
fieldcraft-io = { workspace = true }
fieldcraft-ui-egui = { workspace = true }
solidcraft-theme = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
egui = { workspace = true }
base64 = "0.23"
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Location", "KeyboardEvent", "Event", "EventTarget", "AddEventListenerOptions", "CustomEvent", "CustomEventInit", "Storage"] }
