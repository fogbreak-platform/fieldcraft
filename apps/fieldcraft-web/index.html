<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Fogbreak Field</title>
  <meta name="description" content="Fogbreak Field finite-element modeling in the browser.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Fogbreak Field">
  <meta property="og:title" content="Fogbreak Field">
  <meta property="og:description" content="Fogbreak Field CAE modeling: structures, heat, and fluids.">
  <link data-trunk rel="rust" data-bin="fieldcraft-web" data-wasm-opt="z" data-weak-refs />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #111821; }
    #fieldcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #fieldcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; padding: 0 16px; text-align: center; color: #F7FAFC; font: 14px system-ui, sans-serif; pointer-events: none; }
    #fieldcraft_loading p { margin: 0; max-width: 32em; }
    #fieldcraft_loading.failed { pointer-events: auto; }
    #fieldcraft_loading.failed .spinner { display: none; }
    .spinner { width: 24px; height: 24px; border-radius: 50%; border: 3px solid #2F3F52; border-top-color: #087F9C; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  </style>
</head>
<body>
  <canvas id="fieldcraft_canvas"></canvas>
  <div id="fieldcraft_loading">
    <div class="spinner"></div>
    <p>Loading Fogbreak Field&hellip;</p>
    <noscript><p>Fogbreak Field needs JavaScript and WebAssembly.</p></noscript>
  </div>
  <script>
    // The page could not load or start the app (no WebAssembly, a failed download): say so
    // instead of loading forever. Once the app runs it removes the loading screen.
    (function () {
      function fail(why) {
        var el = document.getElementById("fieldcraft_loading");
        if (!el || el.classList.contains("failed")) return;
        el.classList.add("failed");
        el.textContent = "";
        ["Fogbreak Field could not start: " + why, "It needs a current browser with WebAssembly and WebGPU or WebGL2."].forEach(function (t) {
          var p = document.createElement("p");
          p.textContent = t;
          el.appendChild(p);
        });
      }
      if (typeof WebAssembly !== "object") fail("this browser has no WebAssembly.");
      addEventListener("unhandledrejection", function (e) { fail(String(e.reason && e.reason.message || e.reason)); });
    })();
  </script>
</body>
</html>
